version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sovereign-postgres
    environment:
      POSTGRES_DB: jesse_db
      POSTGRES_USER: jesse_user
      POSTGRES_PASSWORD: jesse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  quant-engine:
    build: .
    container_name: sovereign-quant-engine
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jesse_db
      - DB_USER=jesse_user
      - DB_PASSWORD=jesse_password
    depends_on:
      - postgres

volumes:
  postgres_data:
